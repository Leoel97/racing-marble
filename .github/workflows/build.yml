name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.4.1"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Scarica Godot e i template di export
        run: |
          set -e
          file_editor="Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          file_tpl="Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          for f in "$file_editor" "$file_tpl"; do
            curl -fsSL -o "$f" "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/$f" \
              || curl -fsSL -o "$f" "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/$f"
          done
          mkdir -p "$RUNNER_TEMP/godot" "$RUNNER_TEMP/tpl"
          unzip -q "$file_editor" -d "$RUNNER_TEMP/godot"
          mv "$RUNNER_TEMP/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" "$RUNNER_TEMP/godot/godot"
          chmod +x "$RUNNER_TEMP/godot/godot"
          unzip -q "$file_tpl" -d "$RUNNER_TEMP/tpl"
          mkdir -p "$HOME/.local/share/godot/export_templates"
          mv "$RUNNER_TEMP/tpl/templates" "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          rm "$file_editor" "$file_tpl"
          echo "$RUNNER_TEMP/godot" >> "$GITHUB_PATH"

      - name: Chiave di firma e impostazioni Android
        env:
          KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          set -e
          ks="$RUNNER_TEMP/debug.keystore"
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$ks"
          else
            echo "::warning::Secret DEBUG_KEYSTORE_B64 assente: firma temporanea, per aggiornare servira' disinstallare l'app."
            keytool -genkeypair -keystore "$ks" -storepass android -keypass android \
              -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          minor="${GODOT_VERSION%.*}"
          mkdir -p "$HOME/.config/godot"
          {
            echo '[gd_resource type="EditorSettings" format=3]'
            echo ''
            echo '[resource]'
            echo "export/android/android_sdk_path = \"$ANDROID_HOME\""
            echo "export/android/java_sdk_path = \"$JAVA_HOME\""
            echo "export/android/debug_keystore = \"$ks\""
            echo 'export/android/debug_keystore_user = "androiddebugkey"'
            echo 'export/android/debug_keystore_pass = "android"'
          } > "$HOME/.config/godot/editor_settings-${minor}.tres"
          cat "$HOME/.config/godot/editor_settings-${minor}.tres"

      - name: Importa il progetto
        run: |
          godot --headless --import 2>&1 | tee import.log

      - name: Test automatico (gara simulata)
        run: |
          timeout 300 godot --headless --fixed-fps 60 --quit-after 4200 -- --autostart 2>&1 | tee run.log || true
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script|Compile Error" import.log run.log; then
            echo "::error::Errori negli script"
            exit 1
          fi
          grep -q "SMOKE" run.log || { echo "::error::Il test non e' partito"; exit 1; }

      - name: Verifica collegamento a Supabase
        run: |
          timeout 60 godot --headless -- --authcheck 2>&1 | tee auth.log || true
          grep "AUTHCHECK" auth.log
          grep -q "AUTHCHECK ok=false code=invalid_credentials" auth.log || { echo "::error::Supabase non ha risposto come previsto"; exit 1; }

      - name: Schermate per la revisione
        continue-on-error: true
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb libgl1-mesa-dri > /dev/null
          rm -rf "$RUNNER_TEMP/shots" && mkdir -p "$RUNNER_TEMP/shots"
          timeout -k 5 420 xvfb-run -a -s "-screen 0 1560x720x24" godot --rendering-method gl_compatibility --rendering-driver opengl3 \
            --resolution 1560x720 --fixed-fps 15 -- --shots="$RUNNER_TEMP/shots" > shots.log 2>&1 < /dev/null || true
          pkill -9 -f "godot" || true
          grep -E "SHOT|SCRIPT ERROR|ERROR" shots.log | tail -30 || true
          ls -la "$RUNNER_TEMP/shots"
          cd "$RUNNER_TEMP/shots"
          git init -q -b ci-screens
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add -A && git commit -q -m "Schermate del commit ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" ci-screens

      - name: Esporta APK
        run: |
          mkdir -p build
          godot --headless --export-debug "Android" build/racing-marble.apk 2>&1 | tee export.log
          test -s build/racing-marble.apk
          ls -lh build/

      - uses: actions/upload-artifact@v4
        with:
          name: racing-marble-apk
          path: build/racing-marble.apk

      - name: Pubblica nelle Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag -y || true
          gh release create latest build/racing-marble.apk \
            --title "Racing Marble - ultima build" \
            --notes "Build automatica del commit ${GITHUB_SHA::7}. Scarica racing-marble.apk e installalo sul telefono." \
            --target "$GITHUB_SHA"
